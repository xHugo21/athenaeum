{% extends "base.html" %}
{% block title %}Sign in · athenaeum{% endblock %}
{% block content %}
<style>
  .topbar { display: none; }
  .signin { max-width: 340px; margin: 14vh auto 0; }
  .signin .mark { font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  .signin .mark b { color: var(--accent); }
  .signin .sub { font-size: 13px; color: var(--muted); margin: 6px 0 24px; }
  .signin .panel { padding: 22px; }
  .signin .btn { width: 100%; margin-top: 14px; }
</style>
<div class="signin">
  <div class="mark">athenaeum<b>.</b></div>
  <p class="sub">A private reading archive.</p>
  <div class="panel">
    {% if error %}<p class="flash error" role="alert" onanimationend="this.remove()">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label class="field"><span>Password</span>
        <input type="password" name="password" required autofocus autocomplete="current-password">
      </label>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
