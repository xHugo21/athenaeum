{% extends "base.html" %}
{% block title %}Sign in · athenaeum{% endblock %}
{% block content %}
<div style="max-width:22rem;margin:15vh auto 0">
  <div class="card" style="padding:2rem">
    <h1 style="text-align:center">📚 athenaeum</h1>
    <p class="muted" style="text-align:center;margin-bottom:1.5rem">Enter your password to continue</p>
    {% if error %}<p class="flash error" onanimationend="this.remove()">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required autofocus style="width:100%">
      </div>
      <button style="width:100%">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
