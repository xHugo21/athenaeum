<!doctype html>
<html lang="en">
<head>
<script>
  const storedTheme = localStorage.getItem('athenaeum-theme');
  if (storedTheme === 'light' || storedTheme === 'dark') document.documentElement.dataset.theme = storedTheme;
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/static/logo.svg?v=1" type="image/svg+xml">
<link rel="preload" href="/static/fonts/geist-latin.woff2?v=1" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/geist-mono-latin.woff2?v=1" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon-180.png?v=1">
<meta name="apple-mobile-web-app-title" content="athenaeum">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)">
<title>{% block title %}athenaeum{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css?v={{ static_v }}">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m0 0 5-5m-5 5-5-5"/><path d="M5 18v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.4"/><rect x="13" y="4" width="7" height="7" rx="1.4"/><rect x="4" y="13" width="7" height="7" rx="1.4"/><rect x="13" y="13" width="7" height="7" rx="1.4"/></symbol>
  <symbol id="i-shelf" viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.2 4.6l3.6 1-2.8 14.4-3.6-1z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 8 6 12l4 4M6 12h9"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.8l5.9-.8z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 0 4 23z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H19"/></symbol>
</svg>

<header class="topbar">
  <a class="wordmark" href="/">athenaeum<b>.</b></a>
  {% set path = request.url.path %}
  <nav class="topnav" aria-label="Sections">
    <a href="/" {% if path == '/' or path.startswith('/books/') %}aria-current="page"{% endif %}>Library</a>
    <a href="/stats" {% if path.startswith('/stats') or path.startswith('/calendar') %}aria-current="page"{% endif %}>Stats</a>
    <a href="/tbr" {% if path.startswith('/tbr') %}aria-current="page"{% endif %}>To read</a>
  </nav>
  <div class="end">
    {% if session %}
    <form method="post" action="/logout">
      <button class="iconbtn" type="submit" title="Sign out" aria-label="Sign out">
        <svg class="icon"><use href="#i-logout"/></svg>
      </button>
    </form>
    {% endif %}
    <button id="theme-toggle" class="iconbtn" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
      <svg class="icon theme-icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
      <svg class="icon theme-icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>

<main id="content" tabindex="-1">
  {% block content %}{% endblock %}
</main>

<script>
  const themeBtn = document.getElementById('theme-toggle');
  const currentTheme = () => document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const syncThemeBtn = () => themeBtn.setAttribute('aria-checked', String(currentTheme() === 'dark'));
  syncThemeBtn();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeBtn);
  themeBtn.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('athenaeum-theme', next);
    syncThemeBtn();
  });

  for (const root of document.querySelectorAll('.stars-input')) {
    const form = root.closest('form');
    const input = form?.querySelector('input[name="rating"]');
    const label = document.getElementById(root.dataset.label || '');
    const radios = [...root.querySelectorAll('[role="radio"]')];
    let committed = Number(root.dataset.value) || 0;

    const paint = v => {
      root.dataset.value = v;
      radios.forEach(r => {
        const on = Number(r.dataset.v) === v;
        r.setAttribute('aria-checked', String(on));
        r.tabIndex = on || (!v && r === radios[0]) ? 0 : -1;
      });
      root.querySelectorAll('.star').forEach(star => {
        const i = Number(star.dataset.star);
        star.classList.toggle('on', i <= v);
        star.classList.toggle('half', i - 0.5 === v);
      });
      if (label) label.textContent = v ? `${v} / 5` : 'Not rated';
    };

    const commit = v => {
      committed = v;
      if (input) input.value = v;
      paint(v);
      if ('submit' in root.dataset && form) form.requestSubmit();
    };
    root.commit = commit;

    radios.forEach(r => {
      r.addEventListener('click', () => commit(Number(r.dataset.v)));
      r.addEventListener('mouseenter', () => paint(Number(r.dataset.v)));
    });
    root.addEventListener('mouseleave', () => paint(committed));
    root.addEventListener('keydown', e => {
      const i = radios.indexOf(document.activeElement);
      const step = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
      const next = step
        ? radios[Math.min(radios.length - 1, Math.max(0, i + step))]
        : e.key === 'Home' ? radios[0] : e.key === 'End' ? radios.at(-1) : null;
      if (i < 0 || !next) return;
      e.preventDefault();
      next.focus();
      commit(Number(next.dataset.v));
    });
    paint(committed);
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
