<!doctype html>
<html lang="en">
<head>
<script>
  const storedTheme = localStorage.getItem('athenaeum-theme');
  if (storedTheme === 'light' || storedTheme === 'dark') document.documentElement.dataset.theme = storedTheme;
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/static/logo.svg?v=1" type="image/svg+xml">
<link rel="preload" href="/static/fonts/geist-latin.woff2?v=1" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/geist-mono-latin.woff2?v=1" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon-180.png?v=1">
<meta name="apple-mobile-web-app-title" content="athenaeum">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)">
<title>{% block title %}athenaeum{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css?v={{ static_v }}">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m0 0 5-5m-5 5-5-5"/><path d="M5 18v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.4"/><rect x="13" y="4" width="7" height="7" rx="1.4"/><rect x="4" y="13" width="7" height="7" rx="1.4"/><rect x="13" y="13" width="7" height="7" rx="1.4"/></symbol>
  <symbol id="i-shelf" viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.2 4.6l3.6 1-2.8 14.4-3.6-1z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 8 6 12l4 4M6 12h9"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.8l5.9-.8z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 0 4 23z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H19"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 9.5v4.5"/><path d="M12 17.5h.01"/></symbol>
</svg>

<header class="topbar">
  <a class="wordmark" href="/">athenaeum<b>.</b></a>
  {% set path = request.url.path %}
  <nav class="topnav" aria-label="Sections">
    <a href="/" {% if path == '/' or path.startswith('/books/') %}aria-current="page"{% endif %}>Library</a>
    <a href="/stats" {% if path.startswith('/stats') or path.startswith('/calendar') %}aria-current="page"{% endif %}>Stats</a>
    <a href="/tbr" {% if path.startswith('/tbr') %}aria-current="page"{% endif %}>To read</a>
  </nav>
  <div class="end">
    <button class="iconbtn" type="button" id="palette-open" title="Search or jump to (⌘K)" aria-label="Search or jump to" aria-haspopup="dialog" aria-expanded="false" aria-controls="palette">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
    </button>
    {% if session %}
    <form method="post" action="/logout">
      <button class="iconbtn" type="submit" title="Sign out" aria-label="Sign out">
        <svg class="icon"><use href="#i-logout"/></svg>
      </button>
    </form>
    {% endif %}
    <button id="theme-toggle" class="iconbtn" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
      <svg class="icon theme-icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
      <svg class="icon theme-icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>

<main id="content" tabindex="-1">
  {% block content %}{% endblock %}
</main>

<div class="palette" id="palette" hidden>
  <div class="palette-backdrop"></div>
  <div class="palette-sheet" role="dialog" aria-modal="true" aria-labelledby="palette-title">
    <h2 class="sr-only" id="palette-title">Search or jump to</h2>
    <div class="palette-field">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="palette-input" type="text" role="combobox" aria-label="Search books or run a command" aria-expanded="false" aria-controls="palette-list" aria-autocomplete="list" aria-activedescendant="" placeholder="Search books or run a command" autocomplete="off" spellcheck="false">
      <kbd class="palette-esc">esc</kbd>
    </div>
    <div class="palette-list" id="palette-list" role="listbox" aria-label="Results"></div>
    <p class="palette-empty" id="palette-empty" hidden>Nothing matches.</p>
    <p class="sr-only" id="palette-status" aria-live="polite"></p>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> <kbd>⌃J</kbd><kbd>⌃K</kbd> move</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<script>
  const themeBtn = document.getElementById('theme-toggle');
  const currentTheme = () => document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const syncThemeBtn = () => themeBtn.setAttribute('aria-checked', String(currentTheme() === 'dark'));
  syncThemeBtn();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeBtn);
  themeBtn.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('athenaeum-theme', next);
    syncThemeBtn();
  });

  for (const root of document.querySelectorAll('.stars-input')) {
    const form = root.closest('form');
    const input = form?.querySelector('input[name="rating"]');
    const label = document.getElementById(root.dataset.label || '');
    const radios = [...root.querySelectorAll('[role="radio"]')];
    let committed = Number(root.dataset.value) || 0;

    const paint = v => {
      root.dataset.value = v;
      radios.forEach(r => {
        const on = Number(r.dataset.v) === v;
        r.setAttribute('aria-checked', String(on));
        r.tabIndex = on || (!v && r === radios[0]) ? 0 : -1;
      });
      root.querySelectorAll('.star').forEach(star => {
        const i = Number(star.dataset.star);
        star.classList.toggle('on', i <= v);
        star.classList.toggle('half', i - 0.5 === v);
      });
      if (label) label.textContent = v ? `${v} / 5` : 'Not rated';
    };

    const commit = v => {
      committed = v;
      if (input) input.value = v;
      paint(v);
      if ('submit' in root.dataset && form) form.requestSubmit();
    };
    root.commit = commit;

    radios.forEach(r => {
      r.addEventListener('click', () => commit(Number(r.dataset.v)));
      r.addEventListener('mouseenter', () => paint(Number(r.dataset.v)));
    });
    root.addEventListener('mouseleave', () => paint(committed));
    root.addEventListener('keydown', e => {
      const i = radios.indexOf(document.activeElement);
      const step = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
      const next = step
        ? radios[Math.min(radios.length - 1, Math.max(0, i + step))]
        : e.key === 'Home' ? radios[0] : e.key === 'End' ? radios.at(-1) : null;
      if (i < 0 || !next) return;
      e.preventDefault();
      next.focus();
      commit(Number(next.dataset.v));
    });
    paint(committed);
  }

  (() => {
    const root = document.getElementById('palette');
    if (!root) return;
    const input = document.getElementById('palette-input');
    const list = document.getElementById('palette-list');
    const empty = document.getElementById('palette-empty');
    const status = document.getElementById('palette-status');
    const trigger = document.getElementById('palette-open');
    const topbar = document.querySelector('.topbar');
    const content = document.getElementById('content');
    let books = null, loading = null, options = [], active = -1, opener = null;

    const go = href => { close(false); location.href = href; };
    const can = id => document.getElementById(id) !== null;

    const COMMANDS = [
      { key: 'go-library', section: 'goto', icon: 'i-grid', title: 'Library', hint: '/', keywords: 'books home shelf', run: () => go('/') },
      { key: 'go-stats', section: 'goto', icon: 'i-chart', title: 'Stats', hint: '/stats', keywords: 'statistics numbers reading charts', run: () => go('/stats') },
      { key: 'go-calendar', section: 'goto', icon: 'i-calendar', title: 'Calendar', hint: '/calendar', keywords: 'days heatmap year reading', run: () => go('/calendar') },
      { key: 'go-tbr', section: 'goto', icon: 'i-book', title: 'To read', hint: '/tbr', keywords: 'wishlist queue next', run: () => go('/tbr') },
      { key: 'add-book', section: 'action', icon: 'i-plus', title: 'Add book', keywords: 'new create manual isbn', run: () => (can('add-card') ? openPanel('add-card') : go('/?panel=add')) },
      { key: 'import', section: 'action', icon: 'i-upload', title: 'Import KOReader', keywords: 'sync statistics sqlite upload', run: () => (can('import-card') ? openPanel('import-card') : go('/?panel=import')) },
      { key: 'download', section: 'action', icon: 'i-download', title: 'Download database', hint: 'sqlite', keywords: 'backup export data', run: () => go('/db/download') },
      { key: 'theme', section: 'action', icon: 'i-moon', title: 'Toggle dark mode', hint: 'appearance', keywords: 'theme light night', run: () => { close(false); document.getElementById('theme-toggle').click(); } },
      { key: 'grid', section: 'action', icon: 'i-grid', title: 'Grid view', hint: 'layout', keywords: 'covers tiles', visible: () => can('view-grid'), run: () => { setView(false); close(); } },
      { key: 'shelf', section: 'action', icon: 'i-shelf', title: 'Shelf view', hint: 'layout', keywords: 'spines wood', visible: () => can('view-shelf'), run: () => { setView(true); close(); } },
      { key: 'signout', section: 'action', icon: 'i-logout', title: 'Sign out', keywords: 'log out exit', visible: () => document.querySelector('.topbar .end form') !== null, run: () => { const f = document.createElement('form'); f.method = 'post'; f.action = '/logout'; document.body.append(f); f.submit(); } },
    ];

    function openPanel(id) {
      close(false);
      panel(id, document.querySelector(`[aria-controls="${id}"]`));
    }

    function score(text, q) {
      if (!q) return 1;
      const t = String(text || '').toLowerCase();
      const at = t.indexOf(q);
      if (at >= 0) return 100 + (at === 0 ? 50 : 0) - at;
      let pos = 0, s = 0;
      for (const ch of q) {
        const i = t.indexOf(ch, pos);
        if (i < 0) return 0;
        s += i === pos ? 2 : 1;
        pos = i + 1;
      }
      return s;
    }

    function bookItems(q) {
      if (!books) return [];
      return books
        .map(b => ({
          key: `book-${b.id}`, icon: 'i-book', title: b.title, hint: b.author || 'Unknown author',
          score: Math.max(score(b.title, q), score(b.author, q)),
          run: () => go(`/books/${b.id}`),
        }))
        .filter(i => i.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 6);
    }

    function ranked(section, q) {
      return COMMANDS
        .filter(c => c.section === section && (!c.visible || c.visible()))
        .map(c => ({ ...c, score: Math.max(score(c.title, q), score(c.keywords, q)) }))
        .filter(c => c.score > 0)
        .sort((a, b) => b.score - a.score);
    }

    function loadBooks() {
      if (books || loading) return;
      loading = fetch('/api/books.json', { headers: { accept: 'application/json' } })
        .then(r => (r.ok ? r.json() : []))
        .catch(() => [])
        .then(v => {
          books = Array.isArray(v) ? v : [];
          if (!root.hidden) render();
        });
    }

    function optionEl(item) {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'palette-option';
      el.id = `palette-opt-${item.key}`;
      el.setAttribute('role', 'option');
      el.setAttribute('aria-selected', 'false');
      el.tabIndex = -1;
      el.innerHTML = `<svg class="icon icon-sm" aria-hidden="true"><use href="#${item.icon}"/></svg>`;
      const title = document.createElement('span');
      title.className = 'palette-title';
      title.textContent = item.title;
      el.append(title);
      if (item.hint) {
        const hint = document.createElement('span');
        hint.className = 'palette-hint';
        hint.textContent = item.hint;
        el.append(hint);
      }
      el.addEventListener('click', () => item.run());
      el.addEventListener('mousemove', () => setActive(options.indexOf(el)));
      return el;
    }

    function setActive(i) {
      if (!options.length) {
        active = -1;
        input.removeAttribute('aria-activedescendant');
        return;
      }
      active = (i + options.length) % options.length;
      options.forEach((el, n) => el.setAttribute('aria-selected', String(n === active)));
      const el = options[active];
      input.setAttribute('aria-activedescendant', el.id);
      el.scrollIntoView({ block: 'nearest' });
    }

    function render() {
      const keep = active > 0 || input.value ? options[active]?.id : null;
      const q = input.value.trim().toLowerCase();
      const groups = [
        { id: 'books', label: 'Books', items: bookItems(q) },
        { id: 'goto', label: 'Go to', items: ranked('goto', q) },
        { id: 'actions', label: 'Actions', items: ranked('action', q) },
      ];
      list.textContent = '';
      options = [];
      for (const group of groups) {
        if (!group.items.length) continue;
        const box = document.createElement('div');
        box.className = 'palette-group';
        box.setAttribute('role', 'group');
        box.setAttribute('aria-labelledby', `palette-group-${group.id}`);
        const label = document.createElement('div');
        label.className = 'palette-group-label';
        label.id = `palette-group-${group.id}`;
        label.textContent = group.label;
        box.append(label);
        for (const item of group.items) {
          const el = optionEl(item);
          options.push(el);
          box.append(el);
        }
        list.append(box);
      }
      list.hidden = !options.length;
      empty.hidden = Boolean(options.length);
      status.textContent = options.length ? `${options.length} result${options.length === 1 ? '' : 's'}` : 'No results';
      const restored = keep ? options.findIndex(el => el.id === keep) : -1;
      setActive(restored >= 0 ? restored : 0);
    }

    function open(from) {
      if (!root.hidden) return;
      opener = from || document.activeElement;
      root.hidden = false;
      trigger.setAttribute('aria-expanded', 'true');
      input.setAttribute('aria-expanded', 'true');
      document.body.classList.add('palette-open');
      if (topbar) topbar.inert = true;
      if (content) content.inert = true;
      input.value = '';
      options = [];
      active = -1;
      loadBooks();
      render();
      input.focus();
    }

    function close(restore = true) {
      if (root.hidden) return;
      root.hidden = true;
      trigger.setAttribute('aria-expanded', 'false');
      input.setAttribute('aria-expanded', 'false');
      input.removeAttribute('aria-activedescendant');
      document.body.classList.remove('palette-open');
      if (topbar) topbar.inert = false;
      if (content) content.inert = false;
      if (restore) {
        const target = opener && opener !== document.body && opener.isConnected ? opener : trigger;
        target.focus();
      }
      opener = null;
    }

    trigger.addEventListener('click', () => (root.hidden ? open(trigger) : close()));
    root.querySelector('.palette-backdrop').addEventListener('click', () => close());
    input.addEventListener('input', render);

    document.addEventListener('keydown', e => {
      if (root.hidden) {
        if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          open(document.activeElement);
        }
        return;
      }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || ((e.ctrlKey || e.metaKey) && !e.altKey && 'jk'.includes(e.key.toLowerCase()))) {
        e.preventDefault();
        const down = e.key === 'ArrowDown' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'j');
        setActive(active + (down ? 1 : -1));
      } else if (e.key === 'Home') {
        e.preventDefault();
        setActive(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        setActive(options.length - 1);
      } else if (e.key === 'Enter') {
        if (options[active]) {
          e.preventDefault();
          options[active].dispatchEvent(new MouseEvent('click'));
        }
      } else if (e.key === 'Escape') {
        e.preventDefault();
        close();
      } else if (e.key === 'Tab') {
        e.preventDefault();
      }
    });
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
