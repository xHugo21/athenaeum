<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<title>{% block title %}athenaeum{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8f7f4;
    --surface: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #e0562e;
    --accent-light: #fdeae3;
    --border: #e2e0db;
    --ok-bg: #e6f4ea; --ok-text: #1e7b34; --ok-border: #b7dfc2;
    --err-bg: #fdecea; --err-text: #b3261e; --err-border: #f2b8b5;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08);
    --radius: 10px;
    --radius-sm: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --surface: #252525;
      --text: #e8e8e8;
      --muted: #999;
      --accent: #ff7f50;
      --accent-light: #3d2018;
      --border: #3a3a3a;
      --ok-bg: #1e3323; --ok-text: #8fd694; --ok-border: #2e5236;
      --err-bg: #3d1e1c; --err-text: #f2a196; --err-border: #6b2f2a;
      --shadow: 0 1px 3px rgba(0,0,0,.2);
      --shadow-md: 0 4px 12px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 60rem;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 1.75rem; margin-bottom: .25rem; }
  h2 { font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 1.2rem; margin: 2rem 0 .75rem; color: var(--text); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  nav {
    display: flex; align-items: center; gap: 1.5rem;
    padding: .75rem 0 1.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }
  nav a { font-family: 'Merriweather', Georgia, serif; font-weight: 700; font-size: 1.15rem; color: var(--text); }
  nav a:hover { color: var(--accent); text-decoration: none; }
  nav a.active { color: var(--accent); }
  .muted { color: var(--muted); font-size: .875rem; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.25rem;
  }
  .card-hover { transition: box-shadow .15s, transform .15s; }
  .card-hover:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .cover {
    position: relative; aspect-ratio: 2/3; overflow: hidden;
    border-radius: var(--radius-sm);
    background: linear-gradient(to right, rgba(0,0,0,.12), rgba(0,0,0,0) 9%), var(--accent-light);
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover-fallback {
    position: relative; z-index: 0; padding: .6rem; width: 100%;
    background: var(--ph); color: var(--ph-fg);
    border-radius: var(--radius-sm);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .cover-initial {
    font-family: Georgia, serif; font-weight: 700; font-size: 2.6rem; line-height: 1;
    width: 3.2rem; height: 3.2rem; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: var(--ph-fg); color: var(--ph);
    margin-bottom: .45rem; opacity: .9;
  }
  .stars { position: relative; display: inline-block; line-height: 1; color: #e6a817; }
  .stars .fill { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; pointer-events: none; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: 1rem; }
  .stat-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .stat-value { font-size: 1.3rem; font-weight: 700; }
  .lg { width: 10px; height: 10px; border-radius: 3px; background: var(--border); opacity: .35; }
  .lg.on { opacity: 1; }
  input, textarea, select, button { font-family: inherit; font-size: .9rem; }
  input[type="text"], input:not([type]), input[type="number"], input[type="file"], textarea, select {
    padding: .5rem .75rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    transition: border-color .15s;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  textarea { width: 100%; resize: vertical; }
  button, .btn {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .5rem 1rem;
    border: none; border-radius: var(--radius-sm);
    background: var(--accent); color: #fff;
    font-weight: 600; font-size: .875rem;
    cursor: pointer; transition: opacity .15s;
  }
  button:hover, .btn:hover { opacity: .85; text-decoration: none; }
  .btn-ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text); opacity: 1; }
  .btn-ghost.on { color: var(--accent); border-color: var(--accent); }
  .btn-danger { background: #c0392b; }
  .flash {
    background: var(--ok-bg);
    color: var(--ok-text);
    padding: .6rem 1rem;
    border-radius: var(--radius-sm);
    font-size: .9rem;
    margin-bottom: 1rem;
    border: 1px solid var(--ok-border);
    animation: flash-fade 5s forwards;
  }
  .flash.error { background: var(--err-bg); color: var(--err-text); border-color: var(--err-border); }
  @keyframes flash-fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
  .bar { background: var(--accent); height: .5rem; border-radius: 3px; }
  form.inline { display: inline; }
  .form-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: flex-end; margin-bottom: .75rem; }
  .form-group { margin-bottom: .75rem; }
  .form-group label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: .25rem; text-transform: uppercase; letter-spacing: .03em; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: .5rem .6rem; border-bottom: 1px solid var(--border); text-align: left; }
  th { font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>
{% set path = request.url.path %}
<nav>
  <a href="/" {% if path == '/' or path.startswith('/books/') %}class="active"{% endif %}>📚 athenaeum</a>
  <a href="/stats" {% if path.startswith('/stats') %}class="active"{% endif %}>stats</a>
  
</nav>
{% block content %}{% endblock %}
</body>
</html>
