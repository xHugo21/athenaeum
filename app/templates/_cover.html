<div class="cover">
  <div class="cover-fallback" aria-hidden="true">
    <span class="body">
      <span class="t">{{ b['title'] }}</span>
      <span class="rule"></span>
    </span>
    <span class="a">{{ b['author'] or '' }}</span>
  </div>
  <img src="{{ cover_src }}" alt="{{ cover_alt }}" decoding="async"
       {% if cover_priority %}fetchpriority="high"{% else %}loading="lazy"{% endif %}
       onerror="this.remove()" onload="if(this.naturalWidth<10||this.naturalHeight<10)this.remove()">
</div>
